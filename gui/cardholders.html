<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cardholders</title>
  <link rel="stylesheet" href="./styles-cardholders.css" />
</head>
<body>
  <div class="app-shell">

    <!-- HEADER -->
    <header class="top-bar">
      <div>
        <h1>Cardholders</h1>
        <p class="subtitle">Select one or more cardholders to examine spendings</p>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="content">

      <!-- LEFT: CARDHOLDERS -->
      <section class="cardholders-panel">
        <h2>Detected Users</h2>
        <div id="cardholders-list" class="cardholders-list"></div>
      </section>

      <!-- RIGHT: TRANSACTIONS -->
      <section class="transactions-panel">
        <h2>Transactions</h2>
        <div id="transactions-container">
          <p class="hint">Select cardholders to see transactions.</p>
        </div>
      </section>

    </main>

  </div>

  <script src="renderer-cardholders.js"></script>
</body>
</html>
